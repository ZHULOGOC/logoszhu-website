{{- define "main" }}
<div class="home-page">
  <section class="home-hero">
    <img class="home-photo" src="{{ "picture.jpeg" | absURL }}" alt="photo" width="120" height="120">
    <h1 class="home-name-cn">朱宏辉</h1>
    <p class="home-name-en">Honghui Zhu</p>
    <p class="home-bio">{{ .Site.Params.profileMode.subtitle }}</p>
    <div class="home-links">
      {{- range .Site.Menus.main }}
      <a href="{{ .URL }}">{{ .Name }}</a>
      {{- end }}
    </div>
    <div class="home-social">
      {{- range .Site.Params.socialIcons }}
      <a href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a>
      {{- end }}
    </div>
  </section>
</div>
{{- end }}
